name: Build CSKY extension

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download latest Ghidra release
        id: ghidra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download \
            --repo NationalSecurityAgency/ghidra \
            --pattern 'ghidra_*_PUBLIC_*.zip' \
            --clobber
          zip=$(printf '%s\n' ghidra_*_PUBLIC_*.zip)
          unzip -q "$zip"
          dir=$(find . -maxdepth 1 -type d -name 'ghidra_*_PUBLIC' -printf '%f\n')
          props="$dir/Ghidra/application.properties"
          java_version=$(grep '^application.java.compiler=' "$props" | cut -d= -f2 | tr -d '[:space:]')
          gradle_version=$(grep '^application.gradle.min=' "$props" | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$java_version" ] || [ -z "$gradle_version" ]; then
            echo "Could not read Java or Gradle version from $props"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "java_version=$java_version" >> "$GITHUB_OUTPUT"
          echo "gradle_version=$gradle_version" >> "$GITHUB_OUTPUT"
          echo "Building against $dir (Java $java_version, Gradle $gradle_version)"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.ghidra.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.ghidra.outputs.gradle_version }}

      - name: Build extension
        working-directory: CSKY
        run: gradle -PGHIDRA_INSTALL_DIR=${{ github.workspace }}/${{ steps.ghidra.outputs.dir }} buildExtension

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: csky-extension
          path: CSKY/dist/*.zip
          if-no-files-found: error

      - name: Attach extension to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: CSKY/dist/*.zip
